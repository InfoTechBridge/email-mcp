services:
  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: greenmail
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
      - "3080:8080"   # API
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:password@localhost -Dgreenmail.preload.dir=/data/greenmail-preload"
    volumes:
      - ./greenmail-preload:/greenmail-preload
    restart: unless-stopped

  email-mcp:
    build: .
    image: email-mcp
    container_name: email-mcp
    ports:
      - "5000:8080"
    command: ["dotnet", "EmailMcp.dll", "--http"]
    environment:
      Email__SmtpHost: greenmail
      Email__SmtpPort: 3025
      Email__ImapHost: greenmail
      Email__ImapPort: 3143
      Email__Username: test
      Email__Password: password
      Email__UseSsl: "false"
    restart: unless-stopped
    depends_on:
      - greenmail
