services:
  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: greenmail
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:password@localhost"

  email-mcp:
    build: .
    container_name: email-mcp
    ports:
      - "5000:8080"
    command: ["dotnet", "EmailMcp.dll", "--http"]
    environment:
      Email__SmtpHost: greenmail
      Email__SmtpPort: 3025
      Email__ImapHost: greenmail
      Email__ImapPort: 3143
      Email__Username: test@localhost
      Email__Password: password
      Email__UseSsl: "false"
    depends_on:
      - greenmail
